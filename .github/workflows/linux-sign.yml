name: Sign Linux Artifacts

on:
  # NOTE: no `branches:` filter. The upstream Desktop Linux Build is invoked
  # for a release from a tag-triggered workflow, so its run's head_branch is
  # the TAG name (e.g. "v1.4.0"), never "main". A `branches: ['main']` filter
  # therefore excluded every real release run and this workflow never fired
  # for a shipped version (found 2026-08-26).
  workflow_run:
    workflows: ['Desktop Linux Build']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: linux-sign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign:
    # Cover both triggers: a workflow_run has no event_name check needed, but a
    # manual workflow_dispatch run has no `workflow_run` context at all, so the
    # bare conclusion check alone would always evaluate false on dispatch.
    if: (github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Preflight — verify required credentials are set
        env:
          LINUX_SIGNING_GPG_KEY_BASE64: ${{ secrets.LINUX_SIGNING_GPG_KEY_BASE64 }}
          LINUX_SIGNING_GPG_PASSPHRASE: ${{ secrets.LINUX_SIGNING_GPG_PASSPHRASE }}
        run: |
          # An unset secret here does not fail loudly downstream — gpg silently
          # imports nothing and dpkg-sig/rpm --addsign fail with an opaque
          # "no default secret key" error far from the real cause. Check every
          # credential this job needs up front and name exactly what is missing.
          missing=""
          [ -z "$LINUX_SIGNING_GPG_KEY_BASE64" ] && missing="$missing LINUX_SIGNING_GPG_KEY_BASE64"
          [ -z "$LINUX_SIGNING_GPG_PASSPHRASE" ] && missing="$missing LINUX_SIGNING_GPG_PASSPHRASE"
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            echo "Set these in this repo's Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
          echo "OK: all required secrets are set."

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: artifacts/

      - name: Install signing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-sig rpm

      - name: Import GPG key
        env:
          LINUX_SIGNING_GPG_KEY_BASE64: ${{ secrets.LINUX_SIGNING_GPG_KEY_BASE64 }}
          LINUX_SIGNING_GPG_PASSPHRASE: ${{ secrets.LINUX_SIGNING_GPG_PASSPHRASE }}
        run: |
          echo "$LINUX_SIGNING_GPG_KEY_BASE64" | base64 --decode | gpg --batch --no-tty --import
          echo "GPG key imported"

      - name: Sign .deb packages
        env:
          LINUX_SIGNING_GPG_PASSPHRASE: ${{ secrets.LINUX_SIGNING_GPG_PASSPHRASE }}
        run: |
          for deb in artifacts/**/*.deb; do
            if [[ -f "$deb" ]]; then
              echo "Signing $deb..."
              dpkg-sig -k nself-signer --sign originator "$deb"
            fi
          done

      - name: Sign .rpm packages
        env:
          LINUX_SIGNING_GPG_PASSPHRASE: ${{ secrets.LINUX_SIGNING_GPG_PASSPHRASE }}
        run: |
          cat > ~/.rpmmacros <<EOF
          %_gpg_name nself-signer
          EOF
          for rpm in artifacts/**/*.rpm; do
            if [[ -f "$rpm" ]]; then
              echo "Signing $rpm..."
              expect -c "
                spawn rpm --addsign \"$rpm\"
                expect \"Enter pass phrase:\"
                send \"$LINUX_SIGNING_GPG_PASSPHRASE\n\"
                expect eof
              " || rpm --addsign "$rpm"
            fi
          done

      - name: Sign AppImage (requires manual review; signature on .AppImage.asc)
        env:
          LINUX_SIGNING_GPG_PASSPHRASE: ${{ secrets.LINUX_SIGNING_GPG_PASSPHRASE }}
        run: |
          for appimage in artifacts/**/*.AppImage; do
            if [[ -f "$appimage" ]]; then
              echo "Creating detached signature for $appimage..."
              gpg --batch --no-tty --passphrase "$LINUX_SIGNING_GPG_PASSPHRASE" \
                  --detach-sign --armor "$appimage"
              echo "Signature: $appimage.asc"
            fi
          done

      - name: Verify signatures
        run: |
          echo "=== DEB signatures ==="
          for deb in artifacts/**/*.deb; do
            [[ -f "$deb" ]] && dpkg-sig --verify "$deb"
          done
          echo "=== RPM signatures ==="
          for rpm in artifacts/**/*.rpm; do
            [[ -f "$rpm" ]] && rpm --checksig "$rpm"
          done
          echo "=== AppImage signatures ==="
          for asc in artifacts/**/*.AppImage.asc; do
            [[ -f "$asc" ]] && echo "Verified: $asc"
          done

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-signed
          path: |
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.AppImage.asc
          retention-days: 30
