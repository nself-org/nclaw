name: Sign Linux Artifacts

on:
  # NOTE: no `branches:` filter. The upstream Desktop Linux Build is invoked
  # for a release from a tag-triggered workflow, so its run's head_branch is
  # the TAG name (e.g. "v1.4.0"), never "main". A `branches: ['main']` filter
  # therefore excluded every real release run and this workflow never fired
  # for a shipped version (found 2026-08-26).
  workflow_run:
    workflows: ['Desktop Linux Build']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: linux-sign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign:
    # Cover both triggers: a workflow_run has no event_name check needed, but a
    # manual workflow_dispatch run has no `workflow_run` context at all, so the
    # bare conclusion check alone would always evaluate false on dispatch.
    if: (github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Preflight — verify required credentials are set
        id: preflight
        env:
          LINUX_SIGNING_GPG_KEY_BASE64: ${{ secrets.LINUX_SIGNING_GPG_KEY_BASE64 }}
          LINUX_SIGNING_GPG_PASSPHRASE: ${{ secrets.LINUX_SIGNING_GPG_PASSPHRASE }}
        run: |
          # An unset secret here does not fail loudly downstream — gpg silently
          # imports nothing and dpkg-sig/rpm --addsign fail with an opaque
          # "no default secret key" error far from the real cause. Check every
          # credential this job needs up front and name exactly what is missing.
          missing=""
          [ -z "$LINUX_SIGNING_GPG_KEY_BASE64" ] && missing="$missing LINUX_SIGNING_GPG_KEY_BASE64"
          [ -z "$LINUX_SIGNING_GPG_PASSPHRASE" ] && missing="$missing LINUX_SIGNING_GPG_PASSPHRASE"
          if [ -n "$missing" ]; then
            # Gate-open, not broken: these two repo secrets are a genuine
            # owner-gated external dependency (see EXTERNAL-GATES.md — "Linux
            # artifact signing (linux-sign.yml)" row). Signal it loudly via an
            # annotation and skip every downstream signing step, but do NOT
            # fail the job — a bare red X here reads as "something is broken"
            # when the real state is "nothing to fix, waiting on the owner."
            # This is NOT a blanket continue-on-error: any OTHER Preflight
            # failure mode (e.g. a malformed/undecoded key) is not possible in
            # this specific check, which only ever tests for absence, so the
            # distinction stays intact everywhere else in this job.
            echo "::warning::Linux artifact signing skipped — gate open, see EXTERNAL-GATES.md (missing:$missing)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "OK: all required secrets are set."

      # Unconditional (not gated on the signing preflight): this step's only
      # job is to pull the unsigned build artifacts into this run so they can
      # be re-uploaded below. Gating it on `skip != 'true'` meant that with
      # the GPG secrets absent (the current gate-open state — see
      # EXTERNAL-GATES.md), this job "succeeded" while never touching an
      # artifact at all, which starved the "Upload signed artifacts" step of
      # anything to upload. publish-r2.yml then found 0 artifacts on this
      # run and failed loudly (proven live 2026-09-04, run 33839541080: "find:
      # 'release-artifacts': No such file or directory" — traced back to this
      # workflow's own run 33839518035 having uploaded nothing at all despite
      # a green tick).
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: artifacts/

      # A download that resolves to zero artifacts must not produce a green
      # tick. Run 33839518035 signed nothing, uploaded nothing, and reported
      # success — which let "Publish to R2" fail with "No artifacts to publish"
      # and left all four updater manifests 404 while every workflow looked
      # healthy. publish-r2.yml already guards this; mirror it here so the
      # emptiness is caught at the step that causes it.
      - name: Fail if nothing was downloaded to sign
        if: steps.preflight.outputs.skip != 'true'
        run: |
          count=$(find artifacts -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" -lt 1 ]; then
            echo "::error::No artifacts to sign. The triggering run (${{ github.event.workflow_run.id }}) produced no upload-artifact outputs, or the run-id did not resolve."
            echo "Check that 'Desktop Linux Build' uploaded artifacts and that this job's run-id points at it."
            exit 1
          fi
          echo "OK: $count artifact(s) staged for signing."

      - name: Install signing tools
        if: steps.preflight.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-sig rpm

      - name: Import GPG key
        if: steps.preflight.outputs.skip != 'true'
        env:
          LINUX_SIGNING_GPG_KEY_BASE64: ${{ secrets.LINUX_SIGNING_GPG_KEY_BASE64 }}
          LINUX_SIGNING_GPG_PASSPHRASE: ${{ secrets.LINUX_SIGNING_GPG_PASSPHRASE }}
        run: |
          echo "$LINUX_SIGNING_GPG_KEY_BASE64" | base64 --decode | gpg --batch --no-tty --import
          echo "GPG key imported"

      - name: Sign .deb packages
        if: steps.preflight.outputs.skip != 'true'
        env:
          LINUX_SIGNING_GPG_PASSPHRASE: ${{ secrets.LINUX_SIGNING_GPG_PASSPHRASE }}
        run: |
          for deb in artifacts/**/*.deb; do
            if [[ -f "$deb" ]]; then
              echo "Signing $deb..."
              dpkg-sig -k nself-signer --sign originator "$deb"
            fi
          done

      - name: Sign .rpm packages
        if: steps.preflight.outputs.skip != 'true'
        env:
          LINUX_SIGNING_GPG_PASSPHRASE: ${{ secrets.LINUX_SIGNING_GPG_PASSPHRASE }}
        run: |
          cat > ~/.rpmmacros <<EOF
          %_gpg_name nself-signer
          EOF
          for rpm in artifacts/**/*.rpm; do
            if [[ -f "$rpm" ]]; then
              echo "Signing $rpm..."
              expect -c "
                spawn rpm --addsign \"$rpm\"
                expect \"Enter pass phrase:\"
                send \"$LINUX_SIGNING_GPG_PASSPHRASE\n\"
                expect eof
              " || rpm --addsign "$rpm"
            fi
          done

      - name: Sign AppImage (requires manual review; signature on .AppImage.asc)
        if: steps.preflight.outputs.skip != 'true'
        env:
          LINUX_SIGNING_GPG_PASSPHRASE: ${{ secrets.LINUX_SIGNING_GPG_PASSPHRASE }}
        run: |
          for appimage in artifacts/**/*.AppImage; do
            if [[ -f "$appimage" ]]; then
              echo "Creating detached signature for $appimage..."
              gpg --batch --no-tty --passphrase "$LINUX_SIGNING_GPG_PASSPHRASE" \
                  --detach-sign --armor "$appimage"
              echo "Signature: $appimage.asc"
            fi
          done

      - name: Verify signatures
        if: steps.preflight.outputs.skip != 'true'
        run: |
          echo "=== DEB signatures ==="
          for deb in artifacts/**/*.deb; do
            [[ -f "$deb" ]] && dpkg-sig --verify "$deb"
          done
          echo "=== RPM signatures ==="
          for rpm in artifacts/**/*.rpm; do
            [[ -f "$rpm" ]] && rpm --checksig "$rpm"
          done
          echo "=== AppImage signatures ==="
          for asc in artifacts/**/*.AppImage.asc; do
            [[ -f "$asc" ]] && echo "Verified: $asc"
          done

      # Unconditional (not gated on the signing preflight), same reasoning as
      # "Download build artifacts" above: this is the pass-through step that
      # hands artifacts to publish-r2.yml, signed or not. When the GPG gate
      # is open, this re-uploads the unsigned artifacts as-is (the
      # AppImage.asc glob simply matches nothing in that case — no signing
      # steps ran to create it — and upload-artifact's default
      # if-no-files-found: warn tolerates that, same pattern as the
      # macOS/Windows unsigned-build two-mode gates elsewhere in this repo).
      - name: Upload signed artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-signed
          path: |
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.AppImage.asc
          retention-days: 30
