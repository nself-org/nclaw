name: Desktop macOS Build
on:
  push:
    tags: ['v*']
  workflow_call:
  workflow_dispatch:

concurrency:
  group: desktop-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      # Job-level env indirection: GitHub Actions' `if:` expression parser
      # rejects direct `secrets.X` references on some step conditions
      # ("Unrecognized named-value: 'secrets'", confirmed live 2026-08-30 via
      # workflow_dispatch against this file). Routing through job env first
      # is the standard workaround and lets each step's `if:` test a plain
      # env var instead.
      HAS_APPLE_CERT: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_P12_BASE64 != '' }}
      HAS_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
    steps:
      # pnpm-workspace.yaml (nclaw/pnpm-workspace.yaml) globs
      # '../packages/@nself/*', i.e. the nself-org/packages repo as a SIBLING
      # directory. desktop/package.json depends on five of them (auth-core,
      # graphql-client, i18n, observability, ui) as workspace:*. Checking out
      # only nclaw leaves those unresolvable and `tsc --noEmit` (run by the
      # beforeBuildCommand) dies with TS2307 "Cannot find module '@nself/*'".
      # nclaw goes in a subdir so the sibling lands beside it, matching the
      # layout the workspace file expects (same pattern as desktop-e2e.yml
      # and companion-build.yml).
      - uses: actions/checkout@v7
        with:
          path: nclaw
      - uses: actions/checkout@v7
        with:
          repository: nself-org/packages
          path: packages

      - uses: pnpm/action-setup@v6
        with:
          version: '9'

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'nclaw/desktop/pnpm-lock.yaml'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nclaw/target
          key: cargo-${{ matrix.target }}-${{ hashFiles('nclaw/desktop/src-tauri/Cargo.lock') }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Install pnpm deps
        working-directory: nclaw/desktop
        run: pnpm install --frozen-lockfile

      # Two-mode signing gate: this repo currently has no APPLE_* signing
      # secrets configured (verified via `gh secret list` 2026-08-30 — zero
      # APPLE_* entries exist), so the identity import step is skipped
      # entirely rather than running `security import` against an empty
      # certificate. If/when APPLE_DEVELOPER_ID_APPLICATION_CERT_P12_BASE64 is
      # added as a repo secret, this step activates automatically. The build
      # step below never passes an unresolved "$APPLE_SIGNING_IDENTITY"
      # literal to cargo tauri build — it reads the real secret value (empty
      # string when unset), which cargo tauri / tauri-bundler treats as "no
      # identity" and produces an unsigned .app/.dmg instead of erroring.
      - name: Import Apple cert
        if: ${{ env.HAS_APPLE_CERT == 'true' }}
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PROFILE }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$CERT_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build Tauri
        working-directory: nclaw/desktop
        run: |
          # Two-mode gate, corrected: tauri-bundler's sign::keychain() does
          # NOT treat an empty-but-set APPLE_SIGNING_IDENTITY as "no
          # identity" -- it attempts `codesign --sign ""`, which fails with
          # "The specified item could not be found in the keychain" (proven
          # live 2026-08-31, run 33380061471, macos-14/aarch64-apple-darwin:
          # log shows `Signing with identity ""` immediately before the
          # error). The env var must be genuinely ABSENT for tauri-bundler to
          # skip signing, not merely empty. `if [ -n ... ]` only exports it
          # when the secret actually has a value.
          if [ -n "$APPLE_SIGNING_IDENTITY_SECRET" ]; then
            export APPLE_SIGNING_IDENTITY="$APPLE_SIGNING_IDENTITY_SECRET"
          fi
          cargo tauri build --target ${{ matrix.target }}
        env:
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      # Signed-only verification: codesign --verify fails immediately (and
      # correctly) on an unsigned bundle, so this step only runs when a
      # signing identity was actually supplied. When the gate is absent, the
      # build+upload steps still prove the unsigned artifact was produced.
      - name: Verify codesign
        if: ${{ env.HAS_APPLE_SIGNING_IDENTITY == 'true' }}
        run: |
          for app in nclaw/target/${{ matrix.target }}/release/bundle/macos/*.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
          done

      # Bundles land in the CARGO WORKSPACE target dir (nclaw/target/, not
      # nclaw/desktop/src-tauri/target/ — desktop/src-tauri is a member of
      # the root Cargo.toml workspace). The old path here matched nothing;
      # if-no-files-found: error (already set below) turned that into a
      # visible "Upload artifacts" failure (proven live 2026-08-31, run
      # 33382002757, job 99456257025) rather than the silent zero-artifact
      # success this same bug produced in the sibling Linux/Windows
      # workflows before if-no-files-found was tightened there too.
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-${{ matrix.target }}
          if-no-files-found: error
          path: |
            nclaw/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            nclaw/target/${{ matrix.target }}/release/bundle/macos/*.app
          retention-days: 30

  # Notarization is P7-gated (Apple Developer Program membership — see
  # p6/EXTERNAL-GATES.md "Apple Developer Program"). This job runs
  # unconditionally but every step inside it two-mode gates on the
  # notarization secrets being present, so it degrades to a no-op success
  # rather than a red job when the gate is absent.
  notarize:
    needs: build
    runs-on: macos-14
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      HAS_APPLE_NOTARIZATION: ${{ secrets.APPLE_NOTARIZATION_APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: desktop-macos-${{ matrix.target }}
          path: artifacts/

      - name: Notarize DMG
        if: ${{ env.HAS_APPLE_NOTARIZATION == 'true' }}
        env:
          APPLE_NOTARIZATION_APPLE_ID: ${{ secrets.APPLE_NOTARIZATION_APPLE_ID }}
          APPLE_NOTARIZATION_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
          APPLE_DEVELOPER_TEAM_ID: ${{ secrets.APPLE_DEVELOPER_TEAM_ID }}
        run: |
          chmod +x desktop/scripts/notarize.sh
          for dmg in artifacts/*.dmg; do
            if [[ -f "$dmg" ]]; then
              desktop/scripts/notarize.sh "$dmg"
            fi
          done

      - name: Report notarization gate skipped
        if: ${{ env.HAS_APPLE_NOTARIZATION == 'false' }}
        run: echo "::notice::Apple notarization gate absent (no APPLE_NOTARIZATION_APPLE_ID secret) — uploading unsigned/un-notarized artifact. See p6/EXTERNAL-GATES.md 'Apple Developer Program' row."

      - name: Upload notarized artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-${{ matrix.target }}-notarized
          path: artifacts/*.dmg
          retention-days: 30
